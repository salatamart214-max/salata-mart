
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SALATA MART - Katalog Produk</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #222;
}

header {
  background: #009b65;
  color: white;
  text-align: center;
  padding: 28px 12px;
}

header h1 { margin: 0 0 10px; }

.container {
  max-width: 850px;
  margin: 25px auto;
  padding: 15px;
}

.produk {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: white;
  padding: 18px;
  margin: 12px 0;
  border-radius: 12px;
  box-shadow: 0 2px 8px #ddd;
}

.harga {
  display: block;
  color: #009b65;
  font-weight: bold;
  margin-top: 5px;
}

button {
  background: #009b65;
  color: white;
  padding: 12px 18px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

button:hover { background: #007d51; }

footer {
  text-align: center;
  padding: 20px;
}

@media (max-width: 480px) {
  .produk { padding: 14px; }
  button { padding: 10px 12px; }
}
</style>
</head>
<body>

<header>
  <h1>SALATA MART</h1>
  <p>Belanja mudah, harga bersahabat!</p>
</header>

<main class="container">
  <h2>🛒 Daftar Produk</h2>

  <div class="produk">
    <div>
      <strong>Le Minerale 600 ml</strong>
      <span class="harga">Rp2.500</span>
    </div>
    <button type="button" onclick="pesan('Le Minerale 600 ml')">Pesan</button>
  </div>

  <div class="produk">
    <div>
      <strong>Aqua 600 ml</strong>
      <span class="harga">Rp2.500</span>
    </div>
    <button type="button" onclick="pesan('Aqua 600 ml')">Pesan</button>
  </div>

  <div class="produk">
    <div>
      <strong>Aqua 1500 ml</strong>
      <span class="harga">Rp6.000</span>
    </div>
    <button type="button" onclick="pesan('Aqua 1500 ml')">Pesan</button>
  </div>
</main>

<footer>
  <p>Home Delivery tersedia!</p>
  <p>&copy; 2026 SALATA MART</p>
</footer>

<script>
function pesan(produk) {
  const nomor = "6285373901623";
  const teks = "Halo SALATA MART, saya mau pesan " + produk;
  const url = "https://wa.me/" + nomor +
              "?text=" + encodeURIComponent(teks);

  window.open(url, "_blank");
}
</script>

</body>
</html>
